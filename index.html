<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NVK STOREGE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f2f4f7}
header{background:#0B2C6B;color:white;padding:16px}
header h1{font-size:28px}
.lang{margin-top:10px;display:flex;gap:6px}
.lang button{border:1px solid white;background:transparent;color:white;padding:5px 10px;border-radius:20px}
.lang button.active{background:white;color:#0B2C6B}
.search{padding:14px;background:white;display:flex;gap:8px}
.search input{flex:1;padding:12px;border:1px solid #ddd;border-radius:10px}
.search button{background:#F8BC00;color:white;border:0;padding:0 16px;border-radius:10px;font-size:18px}
.hero{padding:18px;text-align:center}
.hero h2{color:#0B2C6B}
.grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;padding:0 14px}
.cat{background:white;border-radius:14px;padding:12px;text-align:center;font-size:13px}
.cat span{font-size:24px;display:block}
h3{padding:18px 14px 10px;color:#0B2C6B}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 14px 100px}
.card{background:white;border-radius:16px;padding:10px}
.card img{width:100%;height:130px;object-fit:cover;border-radius:12px;background:#ddd}
.card b{display:block;margin-top:8px}
.card small{color:#666}
.price{color:#0B2C6B;font-weight:bold;margin-top:4px}
.btn{position:fixed;bottom:16px;left:14px;right:14px;background:#F8BC00;color:white;text-align:center;padding:16px;border-radius:14px;font-weight:bold;text-decoration:none;font-size:18px}
.empty{background:white;border-radius:14px;padding:20px;text-align:center;color:#666;grid-column:1/3}
</style>
</head>
<body>
<header><h1>NVK STOREGE</h1><p>Petites Annonces à Bunia, Goma, Kisangani</p><div class="lang"><button class="active">FR</button><button>SW</button><button>EN</button><button>LI</button></div></header>
<div class="search"><input id="q" placeholder="Rechercher..."><button>🔍</button></div>
<div class="hero"><h2>Tout acheter, tout vendre<br>à Bunia et Goma</h2><p style="margin-top:8px;color:#555">Annonces locales, rapides et fiables.</p></div>
<div class="grid4"><div class="cat"><span>🚗</span>Véhicules</div><div class="cat"><span>🏠</span>Immobilier</div><div class="cat"><span>📱</span>Téléphones</div><div class="cat"><span>🛵</span>Motos</div></div>
<h3>Annonces récentes - Bunia</h3>
<div class="grid" id="liste"></div>
<a class="btn" href="publier.html">+ Publier une annonce</a>
<script>
function getAnnonces(){
  let keys=['nvk_annonces','nvkAds','annonces','ads'];
  for(let k of keys){ try{ let v=JSON.parse(localStorage.getItem(k)||'[]'); if(v.length) return v; }catch(e){} }
  return [];
}
function afficher(){
  let list=getAnnonces();
  let div=document.getElementById('liste');
  if(!list.length){ div.innerHTML='<div class="empty">Aucune annonce pour le moment.<br>Sois le premier à publier !</div>'; return; }
  div.innerHTML=list.slice().reverse().map(a=>{
    let img=(a.images&&a.images[0])||a.image||'https://via.placeholder.com/400x300?text=NVK';
    let titre=a.titre||a.title||'Annonce';
    let prix=a.prix||a.price||'';
    let lieu=a.ville||a.lieu||a.location||'Bunia';
    return '<div class="card"><img src="'+img+'"><b>'+titre+'</b><small>'+lieu+'</small><div class="price">'+prix+' $</div></div>';
  }).join('');
}
afficher();
document.getElementById('q').addEventListener('input',function(){
  let q=this.value.toLowerCase();
  document.querySelectorAll('.card').forEach(c=>{ c.style.display=c.textContent.toLowerCase().includes(q)?'':'none'; });
});
</script>
</body>
</html>
